<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D4ADF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3D4ADF"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="200" r="280" fill="#3D4ADF" opacity="0.25" filter="url(#blurFilter)"/>
  <circle cx="1000" cy="600" r="320" fill="#8B5CF6" opacity="0.22" filter="url(#blurFilter)"/>
  <circle cx="600" cy="400" r="220" fill="#10B981" opacity="0.12" filter="url(#blurFilter)"/>

  <!-- Grid Pattern -->
  <g opacity="0.06">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M150 0V800M300 0V800M450 0V800M600 0V800M750 0V800M900 0V800M1050 0V800" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Central Card Interface -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="100" width="920" height="600" rx="28" fill="#141824" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Top Window Header -->
    <rect x="140" y="100" width="920" height="56" rx="28" fill="#1A1F30"/>
    <rect x="140" y="128" width="920" height="28" fill="#1A1F30"/>
    <circle cx="180" cy="128" r="6" fill="#EF4444"/>
    <circle cx="200" cy="128" r="6" fill="#F59E0B"/>
    <circle cx="220" cy="128" r="6" fill="#10B981"/>
    <rect x="420" y="114" width="360" height="28" rx="14" fill="#0E121E" stroke="rgba(255,255,255,0.06)"/>
    <text x="600" y="133" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">skool.com/the-ninja-experiment-3274</text>
  </g>

  <!-- Badge Pill -->
  <rect x="220" y="200" width="220" height="34" rx="17" fill="rgba(61, 74, 223, 0.2)" stroke="rgba(61, 74, 223, 0.4)"/>
  <circle cx="236" cy="217" r="4" fill="#10B981"/>
  <text x="250" y="222" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">BUILDER MASTERMIND</text>

  <!-- Brand Title -->
  <text x="220" y="300" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">50NINJAS</text>
  <text x="540" y="300" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">.COM</text>

  <text x="220" y="345" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">The Ninja Experiment: Accelerating Builders from 0 to 100</text>

  <!-- Core Feature Pillars Grid -->
  <g transform="translate(220, 390)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="230" height="180" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="36" cy="36" r="18" fill="rgba(61, 74, 223, 0.2)"/>
    <text x="36" y="42" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="20" y="86" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">0 to 100 Velocity</text>
    <text x="20" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Fast-track tech careers, AI skill mastery, and MVP building sprints.</text>

    <!-- Pillar 2 -->
    <rect x="250" y="0" width="230" height="180" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="286" cy="36" r="18" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="286" y="42" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🎯</text>
    <text x="270" y="86" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Build In Public</text>
    <text x="270" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Weekly accountability, live pitch drills, and peer code reviews.</text>

    <!-- Pillar 3 -->
    <rect x="500" y="0" width="250" height="180" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="536" cy="36" r="18" fill="rgba(139, 92, 246, 0.2)"/>
    <text x="536" y="42" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🥋</text>
    <text x="520" y="86" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Core 50 Cohort</text>
    <text x="520" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Selective mastermind of elite technical creators launching ventures.</text>
  </g>

  <!-- Bottom Stats Strip -->
  <g transform="translate(220, 610)">
    <text x="0" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="1">FOUNDED BY SAIRAM VEEREDDY</text>
    <text x="360" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">•</text>
    <text x="390" y="24" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">ACTIVE SKOOL COMMUNITY</text>
    <text x="660" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">•</text>
    <text x="690" y="24" fill="#3D4ADF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">KAVIVAS ECOSYSTEM</text>
  </g>
</svg>
