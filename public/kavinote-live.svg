<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070E"/>
      <stop offset="0.5" stop-color="#0B132B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="200" y1="40" x2="600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="300" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="answerGrad" x1="0" y1="0" x2="300" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0284C7" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="appleGlow" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow" x="150" y="20" width="500" height="460" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Radial Glow Behind Device -->
  <ellipse cx="400" cy="250" rx="220" ry="180" fill="url(#appleGlow)" filter="url(#glow)"/>

  <!-- Floating iOS Device Body -->
  <g transform="translate(260, 35)">
    <!-- Phone Outer Shadow & Border -->
    <rect x="-2" y="-2" width="284" height="434" rx="42" fill="url(#phoneBorder)" opacity="0.6"/>
    <rect x="0" y="0" width="280" height="430" rx="40" fill="#030712"/>

    <!-- Screen Glass -->
    <rect x="6" y="6" width="268" height="418" rx="36" fill="#080D1A"/>

    <!-- Dynamic Island -->
    <rect x="95" y="16" width="90" height="24" rx="12" fill="#000000"/>
    <circle cx="110" cy="28" r="4.5" fill="#1E293B"/>
    <circle cx="168" cy="28" r="3" fill="#0284C7"/>

    <!-- Status Bar Elements -->
    <text x="32" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">9:41</text>
    <rect x="232" y="24" width="16" height="8" rx="2.5" stroke="#94A3B8" stroke-width="1.2" fill="none"/>
    <rect x="234" y="26" width="10" height="4" rx="1" fill="#38BDF8"/>
    <rect x="249" y="26.5" width="1.5" height="3" rx="0.75" fill="#94A3B8"/>

    <!-- App Header -->
    <g transform="translate(20, 58)">
      <text x="0" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5">KaviNote</text>
      <text x="0" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.5">MEETING &amp; INTERVIEW COPILOT</text>
      <rect x="180" y="4" width="60" height="20" rx="10" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="210" y="17" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">LIVE ON</text>
    </g>

    <!-- Active Listening Indicator Pill -->
    <g transform="translate(18, 104)">
      <rect x="0" y="0" width="244" height="46" rx="15" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#10B981"/>
      <text x="32" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Listening to Meeting Audio</text>
      <text x="32" y="33" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">100% On-Device &bull; Zero Cloud Upload</text>

      <!-- Waveform Bars -->
      <g transform="translate(195, 15)">
        <rect x="0" y="4" width="2.5" height="8" rx="1.2" fill="#38BDF8"/>
        <rect x="5" y="1" width="2.5" height="14" rx="1.2" fill="#60A5FA"/>
        <rect x="10" y="0" width="2.5" height="16" rx="1.2" fill="#818CF8"/>
        <rect x="15" y="3" width="2.5" height="10" rx="1.2" fill="#38BDF8"/>
        <rect x="20" y="5" width="2.5" height="6" rx="1.2" fill="#60A5FA"/>
      </g>
    </g>

    <!-- Card 1: Question Detected -->
    <g transform="translate(18, 160)">
      <rect x="0" y="0" width="244" height="66" rx="16" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <rect x="12" y="10" width="98" height="16" rx="8" fill="#EF4444" fill-opacity="0.15"/>
      <text x="18" y="21" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">QUESTION DETECTED</text>
      <text x="12" y="42" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">"How do you handle multi-agent audit trails?"</text>
      <text x="12" y="56" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Asked 3s ago &bull; Matching in your notebook...</text>
    </g>

    <!-- Card 2: Instant Answer Card -->
    <g transform="translate(18, 234)">
      <rect x="0" y="0" width="244" height="136" rx="16" fill="url(#answerGrad)" stroke="#0284C7" stroke-width="1"/>
      <rect x="12" y="10" width="92" height="16" rx="8" fill="#0284C7" fill-opacity="0.25"/>
      <text x="18" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">&bull; INSTANT ANSWER</text>
      <text x="12" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Read With Confidence:</text>

      <circle cx="16" cy="60" r="2" fill="#38BDF8"/>
      <text x="24" y="63" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Immutable bias ledger &amp; prompt log</text>

      <circle cx="16" cy="76" r="2" fill="#38BDF8"/>
      <text x="24" y="79" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">SOC2 &amp; EEOC safety audit compliance</text>

      <circle cx="16" cy="92" r="2" fill="#38BDF8"/>
      <text x="24" y="95" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">100% on-device local neural engine</text>

      <!-- Confidence Pill -->
      <rect x="12" y="108" width="220" height="18" rx="9" fill="#0284C7" fill-opacity="0.15"/>
      <text x="122" y="120" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Found in: Architecture Notes / Q4 Strategy</text>
    </g>

    <!-- Bottom Home Indicator -->
    <rect x="90" y="412" width="100" height="4" rx="2" fill="#475569"/>
  </g>

  <!-- Left Accent Feature Pill -->
  <g transform="translate(48, 170)">
    <rect x="0" y="0" width="186" height="60" rx="30" fill="#0B132B" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="15" fill="#0284C7" fill-opacity="0.25"/>
    <path d="M30 22 L30 38 M22 30 L38 30" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="56" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">100% On-Device</text>
    <text x="56" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Zero Data Collected</text>
  </g>

  <!-- Right Accent Feature Pill -->
  <g transform="translate(565, 230)">
    <rect x="0" y="0" width="186" height="60" rx="30" fill="#0B132B" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="15" fill="#10B981" fill-opacity="0.2"/>
    <path d="M25 30 L29 34 L35 26" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Live Copilot</text>
    <text x="56" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">kavinote.app &bull; Live</text>
  </g>
</svg>
